<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MyDaily 个人管理系统 - 任务管理、习惯跟踪、番茄钟和笔记">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
    <link rel="manifest" href="manifest.json">
    <title>个人管理系统 - 减压优化版</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.7.7/lunar.min.js" integrity="sha384-iXI9vi2pixNkaDnuAUXJzz4e9IHrZ1XMl4HywSf6HMWCg6oFCb5NTad00z3qA744" crossorigin="anonymous"></script>
</head>
<body>
    <a href="#main-content" class="skip-link">跳转到主内容</a>
    <!-- 顶部导航栏 -->
    <nav class="main-nav">
        <div class="nav-container">
            <div class="logo"><i class="fas fa-brain"></i><span>MyDaily</span></div>
            <a href="index.html" class="nav-link active" aria-label="仪表盘"><i class="fas fa-tachometer-alt"></i><span>仪表盘</span></a>
            <a href="dashboard.html" class="nav-link" aria-label="数据统计"><i class="fas fa-chart-bar"></i><span>数据统计</span></a>
            <a href="calendar.html" class="nav-link" aria-label="日历视图"><i class="fas fa-calendar-alt"></i><span>日历视图</span></a>
            <div class="nav-actions">
                <button class="focus-mode-btn" id="focusModeBtn" aria-label="专注模式"><i class="fas fa-eye"></i><span>专注模式</span></button>
            </div>
        </div>
    </nav>

    <main class="main-content" id="main-content">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-section time-progress-section">
                <h3>时间进度</h3>
                <div id="timeProgress"></div>
            </div>

            <div class="sidebar-section">
                <h3>快速操作</h3>
                <button class="quick-action-btn" id="addTaskBtn"><i class="fas fa-plus"></i><span>新建任务</span></button>
                <button class="quick-action-btn" id="addNoteBtn"><i class="fas fa-sticky-note"></i><span>快速笔记</span></button>
                <button class="quick-action-btn" id="startPomodoroBtn"><i class="fas fa-clock"></i><span>开始番茄钟</span></button>
            </div>

            <div class="sidebar-section pomodoro-section">
                <h3>番茄钟</h3>
                <div class="pomodoro-timer" id="pomodoroTimer">
                    <div class="timer-display">
                        <span class="time" id="timerDisplay"></span>
                        <span class="timer-label" id="timerLabel"></span>
                    </div>
                    <div class="timer-controls">
                        <button class="timer-btn play" id="playPauseBtn" aria-label="开始或暂停番茄钟"><i class="fas fa-play"></i></button>
                        <button class="timer-btn reset" id="resetBtn" aria-label="重置番茄钟"><i class="fas fa-refresh"></i></button>
                        <button class="timer-btn settings" id="timerSettingsBtn" aria-label="番茄钟设置"><i class="fas fa-cog"></i></button>
                    </div>
                    <div class="timer-progress">
                        <div class="progress-ring">
                            <svg width="120" height="120">
                                <circle cx="60" cy="60" r="50" class="progress-ring-track"></circle>
                                <circle cx="60" cy="60" r="50" class="progress-ring-circle"></circle>
                            </svg>
                        </div>
                    </div>
                    <div class="pomodoro-stats" id="pomodoroStats"></div>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>数据管理</h3>
                <button class="quick-action-btn" onclick="app.exportData()"><i class="fas fa-download"></i><span>导出数据</span></button>
                <button class="quick-action-btn" onclick="app.importData()"><i class="fas fa-upload"></i><span>导入数据</span></button>
                <button class="quick-action-btn" onclick="app.clearAll()" style="color:var(--error)"><i class="fas fa-exclamation-triangle"></i><span>清空数据</span></button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <div class="content-area">
            <section class="dashboard-section" id="taskDashboard">
                <div class="section-header">
                    <h2>任务管理</h2>
                    <div class="dashboard-controls">
                        <label for="taskSearch" class="sr-only">搜索任务</label>
                        <input type="text" class="search-input" id="taskSearch" placeholder="搜索任务...">
                        <label for="priorityFilter" class="sr-only">优先级筛选</label>
                        <select class="filter-select" id="priorityFilter">
                            <option value="">所有优先级</option>
                            <option value="high">高优先级</option>
                            <option value="medium">中优先级</option>
                            <option value="low">低优先级</option>
                        </select>
                        <label for="statusFilter" class="sr-only">状态筛选</label>
                        <select class="filter-select" id="statusFilter">
                            <option value="">所有状态</option>
                            <option value="todo">待办</option>
                            <option value="in-progress">进行中</option>
                            <option value="done">已完成</option>
                        </select>
                    </div>
                </div>

                <div class="daily-task-stats"></div>

                <div class="kanban-board">
                    <div class="kanban-column" data-status="todo">
                        <div class="column-header"><h3>待办事项</h3><span class="column-header-meta"><span class="task-count" id="todoCount">0</span><button class="column-add-btn" data-column="todo" aria-label="添加任务到待办"><i class="fas fa-plus"></i></button></span></div>
                        <div class="task-list" id="todoList"></div>
                        <button class="add-task-btn" data-column="todo"><i class="fas fa-plus"></i><span>添加任务</span></button>
                    </div>
                    <div class="kanban-column" data-status="in-progress">
                        <div class="column-header"><h3>进行中</h3><span class="column-header-meta"><span class="task-count" id="inProgressCount">0</span><button class="column-add-btn" data-column="in-progress" aria-label="添加任务到进行中"><i class="fas fa-plus"></i></button></span></div>
                        <div class="task-list" id="inProgressList"></div>
                        <button class="add-task-btn" data-column="in-progress"><i class="fas fa-plus"></i><span>添加任务</span></button>
                    </div>
                    <div class="kanban-column" data-status="done">
                        <div class="column-header"><h3>已完成</h3><span class="column-header-meta"><span class="task-count" id="doneCount">0</span></span></div>
                        <div class="task-list" id="doneList"></div>
                    </div>
                </div>
            </section>

            <section class="productivity-section">
                <div class="tool-card habits-card">
                    <div class="card-header"><h3>习惯跟踪</h3><button class="card-action-btn" id="addHabitBtn" aria-label="添加习惯"><i class="fas fa-plus"></i></button></div>
                    <div class="habits-grid" id="habitsGrid"></div>
                </div>

                <div class="tool-card priority-matrix-card">
                    <div class="card-header"><h3>优先级矩阵</h3></div>
                    <div class="priority-matrix">
                        <div class="matrix-quadrant urgent-important"><h4>紧急且重要</h4><div class="quadrant-items" id="quadrant1"></div></div>
                        <div class="matrix-quadrant not-urgent-important"><h4>重要不紧急</h4><div class="quadrant-items" id="quadrant2"></div></div>
                        <div class="matrix-quadrant urgent-not-important"><h4>紧急不重要</h4><div class="quadrant-items" id="quadrant3"></div></div>
                        <div class="matrix-quadrant not-urgent-not-important"><h4>不紧急不重要</h4><div class="quadrant-items" id="quadrant4"></div></div>
                    </div>
                </div>

                <div class="tool-card notes-card">
                    <div class="card-header"><h3>快速笔记</h3><button class="card-action-btn" id="postNoteBtn" title="发布笔记"><i class="fas fa-paper-plane"></i></button></div>
                    <label for="quickNotesInput" class="sr-only">快速笔记内容</label>
                    <textarea id="quickNotesInput" class="quick-notes-input" placeholder="记录你的想法和灵感，回车换行..."></textarea>
                    <div class="notes-status"><span></span><span class="char-count">0 字符</span></div>
                    <div id="noteStreamContainer" class="note-stream-container"></div>
                </div>
            </section>
        </div>
    </main>

    <!-- 新建任务模态窗口 -->
    <div class="modal" id="addTaskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>新建任务</h3>
                <button class="close-btn" data-modal="addTaskModal" aria-label="关闭新建任务对话框"><i class="fas fa-times"></i></button>
            </div>
            <form class="task-form" id="taskForm">
                <div class="form-group"><label for="taskTitle">任务标题</label><input type="text" id="taskTitle" class="form-input" required></div>
                <div class="form-group"><label for="taskDescription">描述</label><textarea id="taskDescription" class="form-textarea"></textarea></div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriority">优先级</label>
                        <select id="taskPriority" class="form-select">
                            <option value="low">低</option>
                            <option value="medium" selected>中</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                    <div class="form-group"><label for="taskDeadline">截止日期</label><input type="date" id="taskDeadline" class="form-input"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label for="taskStartTime">开始时间</label><input type="time" id="taskStartTime" class="form-input" step="300"></div>
                    <div class="form-group"><label for="taskEndTime">结束时间</label><input type="time" id="taskEndTime" class="form-input" disabled step="300"></div>
                </div>
                <div class="form-group">
                    <label for="taskQuadrant">优先级矩阵象限</label>
                    <select id="taskQuadrant" class="form-select">
                        <option value="auto" selected>自动分配</option>
                        <option value="1">紧急且重要</option>
                        <option value="2">重要不紧急</option>
                        <option value="3">紧急不重要</option>
                        <option value="4">不紧急不重要</option>
                    </select>
                </div>
                <div class="form-group"><label>标签</label><div id="taskTagsContainer"></div></div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" data-modal="addTaskModal">取消</button>
                    <button type="submit" class="btn btn-primary">创建任务</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 番茄钟设置模态窗口 -->
    <div class="modal" id="timerSettingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>番茄钟设置</h3>
                <button class="close-btn" data-modal="timerSettingsModal" aria-label="关闭番茄钟设置对话框"><i class="fas fa-times"></i></button>
            </div>
            <form class="settings-form" id="timerSettingsForm">
                <div class="form-group"><label for="workDuration">工作时长（分钟）</label><input type="number" id="workDuration" class="form-input" value="25" min="1" max="60"></div>
                <div class="form-group"><label for="shortBreak">短休息（分钟）</label><input type="number" id="shortBreak" class="form-input" value="5" min="1" max="30"></div>
                <div class="form-group"><label for="longBreak">长休息（分钟）</label><input type="number" id="longBreak" class="form-input" value="15" min="1" max="60"></div>
                <div class="form-group"><label for="cyclesBeforeLongBreak">长休息前的循环次数</label><input type="number" id="cyclesBeforeLongBreak" class="form-input" value="4" min="2" max="10"></div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" data-modal="timerSettingsModal">取消</button>
                    <button type="submit" class="btn btn-primary">保存设置</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 专注模式覆盖层 -->
    <div class="focus-overlay" id="focusOverlay">
        <div class="focus-content">
            <h2>专注模式</h2>
            <p>当前任务：<span id="currentFocusTask">点击选择任务</span></p>
            <div class="focus-timer" id="focusTimer"></div>
            <div class="focus-actions">
                <button class="btn btn-success" id="completeFocusTaskBtn" style="display:none"><i class="fas fa-check"></i> 完成任务</button>
                <button class="btn btn-primary" id="exitFocusBtn"><i class="fas fa-times"></i> 退出专注模式</button>
            </div>
        </div>
    </div>

    <label for="importFileInput" class="sr-only">导入数据文件</label>
    <input type="file" id="importFileInput" accept=".json" style="display:none" aria-label="导入数据文件">
    <div id="notificationRegion" aria-live="polite" aria-atomic="true" class="sr-only"></div>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
    </script>
</body>
</html>
